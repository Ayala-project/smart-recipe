<div class="login-container">
  <div class="login-content">
    <div class="switch">
      <div class="option" routerLink="/register">
        <div class="text">הרשמה</div>
      </div>
      <div class="option selected">
        <div class="text">כניסה</div>
      </div>
      <div class="bar"></div>
    </div>

    <div class="form-content">
      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="form-group">
          <input 
            id="username" 
            [(ngModel)]="username" 
            name="username" 
            required
            placeholder=" ">
          <span class="bar"></span>
          <label>שם משתמש</label>
        </div>

        <div class="form-group">
          <input 
            id="password" 
            type="password" 
            [(ngModel)]="password" 
            name="password" 
            required
            placeholder=" ">
          <span class="bar"></span>
          <label>סיסמה</label>
        </div>

        <button type="submit" class="submit-btn" [class.sending]="isSending">
          <i class="material-icons">{{ isSending ? 'done' : 'login' }}</i>
        </button>
      </form>
    </div>
  </div>
</div>
