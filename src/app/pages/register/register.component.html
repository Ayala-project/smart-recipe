<div class="register-container">
  <div class="register-content">
    <div class="switch">
      <div class="option selected">
        <div class="text">הרשמה</div>
      </div>
      <div class="option" routerLink="/login">
        <div class="text">כניסה</div>
      </div>
      <div class="bar" [style.left]="activeView === 'register' ? '0' : '50%'"></div>
    </div>

    <div class="form-content">
      <form (ngSubmit)="register()" #registerForm="ngForm">
        <div class="form-group">
          <input 
            id="username" 
            [(ngModel)]="username" 
            name="username" 
            required
            placeholder=" ">
          <span class="bar"></span>
          <label>שם משתמש</label>
          <div class="error-message" *ngIf="errors['username']">{{errors['username']}}</div>
        </div>

        <div class="form-group">
          <input 
            id="email" 
            [(ngModel)]="email" 
            name="email" 
            type="email" 
            required
            placeholder=" ">
          <span class="bar"></span>
          <label>אימייל</label>
          <div class="error-message" *ngIf="errors['email']">{{errors['email']}}</div>
        </div>

        <div class="form-group">
          <input 
            id="password" 
            type="password" 
            [(ngModel)]="password" 
            name="password" 
            required
            placeholder=" ">
          <span class="bar"></span>
          <label>סיסמה</label>
          <div class="error-message" *ngIf="errors['password']">{{errors['password']}}</div>
        </div>

        <button type="submit" class="submit-btn" [class.sending]="isSending">
          <i class="material-icons">{{ isSending ? 'done' : 'send' }}</i>
        </button>
      </form>
    </div>
  </div>
</div>
